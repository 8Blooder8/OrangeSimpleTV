name: DeepSec pattern scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'docs/HARNESS.md'
      - '.github/workflows/deepsec-pattern-scan.yml'

concurrency:
  group: deepsec-pattern-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Cache package stores
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
          key: deepsec-pattern-${{ runner.os }}-${{ hashFiles('app/**', 'tests/**', 'tools/**') }}
          restore-keys: |
            deepsec-pattern-${{ runner.os }}-

      - name: Scaffold DeepSec without AI or login
        run: npx -y deepsec init --scaffold-only

      - name: Install DeepSec workspace
        working-directory: .deepsec
        run: pnpm install --prefer-offline

      - name: Run free local pattern scan
        working-directory: .deepsec
        run: pnpm deepsec scan

      - name: Upload scan workspace for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepsec-pattern-${{ github.sha }}
          path: |
            .deepsec/data
            .deepsec/generated-matchers.ts
          if-no-files-found: warn
          retention-days: 7
