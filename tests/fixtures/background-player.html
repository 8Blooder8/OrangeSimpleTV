<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000}
    #player-wrapper{width:100%;height:100%}
    [data-testid="player-container"]{position:absolute;left:0;top:0;width:640px;height:360px}
    button{position:absolute;left:40px;top:400px;width:120px;height:60px}
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div data-testid="player-container" mode="background">
      <video id="video-player" src="blob:https://tvgo.orange.pl/sanitized-test"></video>
    </div>
    <div data-testid="base-overlay-container" mode="background">
      <button id="expand-player" type="button"><div data-testid="IconPlayerScroll">expand</div></button>
    </div>
  </div>
</body>
</html>
